{% extends "base.html" %}
{% block title %}Nuevo proyecto — Writara{% endblock %}

{% block content %}
<div class="page page--centered fade-in">
  <h1 class="page-title">Nuevo proyecto</h1>
  <form method="post" action="/projects/new/">
    {% csrf_token %}
    <div class="form-group">
      <label class="form-label">Nombre</label>
      <input type="text" name="name" class="form-input" placeholder="Mi novela" autofocus required>
    </div>
    <div class="form-group">
      <label class="form-label">Descripción (opcional)</label>
      <textarea name="description" class="form-input" rows="3" placeholder="De qué trata…"></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">Color de portada</label>
      <input type="color" name="cover_color" value="#6366f1" style="width:48px;height:36px;border:none;background:none;cursor:pointer;padding:0">
    </div>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button type="submit" class="btn btn--primary">Crear proyecto</button>
      <a href="/projects/" class="btn btn--ghost">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
