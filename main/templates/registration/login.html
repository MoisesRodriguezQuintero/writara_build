<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Writara — Iniciar sesión</title>
  <link rel="stylesheet" href="/static/css/writara.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card__logo">Writara</div>
    <div class="auth-card__tagline">Tu espacio de escritura y conocimiento</div>

    {% if form.errors %}
    <div style="background:rgba(224,82,82,0.1);border:1px solid var(--danger);border-radius:var(--radius);padding:10px 14px;margin-bottom:18px;font-size:0.85rem;color:var(--danger)">
      Usuario o contraseña incorrectos.
    </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Usuario</label>
        <input type="text" name="username" class="form-input" autocomplete="username" autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">Contraseña</label>
        <input type="password" name="password" class="form-input" autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn--primary w-full" style="justify-content:center;margin-top:8px">Entrar</button>
    </form>

    <p style="text-align:center;margin-top:20px;font-size:0.83rem;color:var(--text-3)">
      ¿Sin cuenta? <a href="/accounts/register/">Crear cuenta</a>
    </p>
  </div>
</div>
</body>
</html>
